project:
  name: Sugarcane Anomaly Early Warning System
  random_seed: 42
paths:
  vv_dir: data/raw/vv
  vh_dir: data/raw/vh
  blocks: data/vectors/blocks.geojson
  observations: data/metadata/observations.csv
  outputs: outputs
  models: models
raster:
  input_units: db  # db or linear; SNAP output may be either
  dst_crs: EPSG:32736  # set to local projected CRS
  nodata: -9999.0
  rvi_clip: [0.0, 4.0]
  all_touched: false
baseline:
  healthy_column: healthy
  grouping: [variety, crop_type]
  age_bin_days: 14
  min_samples: 5
  smoothing_window: 3
anomaly:
  methods: [threshold, zscore, trend, isolation_forest]
  weights:
    threshold: 0.30
    zscore: 0.30
    trend: 0.15
    isolation_forest: 0.25
  watch_percent: -10
  moderate_percent: -20
  high_percent: -30
  critical_percent: -40
  persistence_dates: 2
  pixel_z_threshold: -2.0
alerts:
  minimum_risk: High Risk
  affected_area_percent: 10
gaps:
  # --- Sentinel-1 + Sentinel-2 canopy-gap detection (src/gap_detection.py) ---
  ndvi_bare: 0.35            # NDVI below this = no green cover
  h_gap_frac: 0.50           # canopy shorter than this fraction of the average cane height = gap-height
  h_ok_frac: 0.75            # canopy at/above this fraction = full canopy
  s1_metric: VH_dB           # VH_dB or RVI (RVI matches the early-warning pipeline)
  soil_contrast_db: 6.0      # default cane-minus-bare-soil VH contrast if a field has no bare pixels
  soil_contrast_rvi: 0.35
  edge_buffer_m: 10          # ignore pixels this close to the field boundary
  min_patch_px: 4            # gap patches smaller than this many 10 m pixels are treated as noise
  min_age_days: 120          # canopy normally not closed before this age -> gaps not meaningful
  height_curve:              # generic logistic height-for-age (m); replace with your measured averages
    h_max: 3.6
    k: 0.025
    t0: 150
  severity_pct: {low: 5, moderate: 10, high: 20}   # gap % bands: <5 Low, <10 Moderate, <20 High, else Severe
  s2: {min_clear_fraction: 0.85, lookback_days: 60, max_tile_cloud: 80}
  s1: {orbit: ASCENDING, window_days: 12, max_scenes: 4, speckle_px: 3}
